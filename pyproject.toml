[project]
name = "orders-mcp"
version = "0.1.0"
description = "A read-only MCP server that lets Claude look up customers and orders in a shop database."
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4.9"]

[project.scripts]
orders-mcp = "orders_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orders_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
